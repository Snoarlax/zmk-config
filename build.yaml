# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
#     artifact-name: corne_left_with_logging
#
---
include:
  - board: nice_nano_v2
    shield: lily58_left nice_view_adapter nice_view_gem
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: nice_nano_v2
    shield: lily58_right nice_view_adapter nice_view_gem
  # Right half with the Snorlax art instead of the gem's crystal, animated.
  # The panel's rotation direction isn't knowable from the art it replaces,
  # so both are built: if the Snorlax lands upside down, flash the _ccw one.
  - board: nice_nano_v2
    shield: lily58_right nice_view_adapter nice_view_snorlax
    cmake-args: -DCONFIG_NICE_VIEW_GEM_ANIMATION=y
    artifact-name: lily58_right_snorlax
  - board: nice_nano_v2
    shield: lily58_right nice_view_adapter nice_view_snorlax
    cmake-args: -DCONFIG_NICE_VIEW_GEM_ANIMATION=y -DCONFIG_NICE_VIEW_SNORLAX_ROTATE_CCW=y
    artifact-name: lily58_right_snorlax_ccw
  - board: nice_nano_v2
    shield: settings_reset
